<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Assistant - Ваш персональный ИИ-помощник</title>
    <meta name="description" content="Friday Assistant — персональный AI-помощник на базе Gemini для управления компьютером и телефоном с помощью голосовых команд.">
    <meta name="theme-color" content="#6A3D8B">
    <link rel="icon" type="image/x-icon" href="images/f.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo">
                    <h1>Friday Assistant</h1>
                    <p class="tagline">Ваш AI-помощник</p>
                </div>
            </div>
            <div class="header-right">
                <div class="header-downloads">
                    <a href="/download-windows" class="dl-icon" title="Скачать для Windows"><i class="fab fa-windows"></i></a>
                    <a href="/download-android" class="dl-icon" title="Скачать для Android"><i class="fab fa-android"></i></a>
                </div>
                <div class="auth-buttons">
                    <button class="auth-btn register-btn">Регистрация</button>
                    <button class="auth-btn login-btn">Вход</button>
                </div>
            </div>
        </header>

        <div class="app-layout">
            <aside class="sidebar card" id="sidebar">
                <button class="new-chat-btn" id="newChatBtn">
                    <i class="fas fa-plus"></i> Новый чат
                </button>
                <div class="dialog-list" id="dialogList">
                    <div class="dialog-item active" data-id="local">Гостевой диалог</div>
                </div>
            </aside>

            <main class="card chat-section">
                <div class="chat-header">
                    <i class="fas fa-robot"></i>
                    <h2>Чат с ассистентом</h2>
                </div>
                
                <div class="chat-controls">
                    <div class="control-group">
                        <label for="voice-type">Голос:</label>
                        <select id="voice-type">
                            <option value="Aoede" selected>Aoede (Женский)</option>
                            <option value="Puck">Puck (Мужской)</option>
                            <option value="Kore">Kore (Строгий)</option>
                            <option value="Charon">Charon (Эксперт)</option>
                        </select>
                    </div>
                    <button id="camera-btn" class="microphone-btn" title="Трансляция камеры">
                        <i class="fas fa-video"></i>
                    </button>
                    <button id="screen-btn" class="microphone-btn" title="Трансляция экрана">
                        <i class="fas fa-desktop"></i>
                    </button>
                    <button id="microphone-btn" class="microphone-btn">
                        <i class="fas fa-microphone"></i>
                        <span>Включить микрофон</span>
                    </button>
                    <button id="clear-history" class="microphone-btn" style="background: var(--warning);">
                        <i class="fas fa-trash"></i>
                        <span>Очистить историю</span>
                    </button>
                </div>
                
                <div class="chat-messages" id="chatMessages"></div>

                <!-- Обновленный контейнер для видео (с центрированием) -->
                <div id="video-preview-container" style="display: none; justify-content: center; align-items: center; background: #1a1a1a; padding: 10px; border-radius: 8px 8px 0 0; margin-top: 10px; border-bottom: 1px solid #333;">
                    <video id="live-video" style="max-height: 200px; max-width: 100%; border-radius: 8px; object-fit: contain; transition: transform 0.3s ease;" autoplay playsinline muted></video>
                </div>
                
                <div class="chat-input" style="border-radius: 0 0 8px 8px;">
                    <div class="chat-input-wrapper">
                        <div class="file-input-wrapper">
                            <input type="file" id="file-upload" accept=".png,.jpg,.jpeg">
                            <button class="attach-btn" title="Прикрепить файл">
                                <i class="fas fa-paperclip"></i>
                            </button>
                        </div>
                        <textarea id="messageInput" placeholder="Введите ваше сообщение..." rows="1"></textarea>
                        <span class="hint">Shift+Enter для переноса строки</span>
                    </div>
                    <div class="image-preview-container" id="imagePreviewContainer" style="display: none;"></div>
                    <button id="sendMessage">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </main>
        </div>
        <footer><p>© 2026 Friday Assistant. Все права защищены.</p></footer>
    </div>

    <!-- Скрытый канвас для захвата кадров -->
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <div class="notification" id="notification"><i class="fas fa-check-circle"></i><span id="notification-text"></span></div>
    
    <!-- Модалки (Регистрация, Вход, Восстановление) -->
    <div id="registerModal" class="modal"><div class="modal-content"><div class="modal-header"><h2>Регистрация</h2><span class="modal-close">&times;</span></div><form id="registerForm"><div class="form-group"><label for="regEmail">Email:</label><input type="email" id="regEmail" required></div><div class="form-group"><label for="regLogin">Логин:</label><input type="text" id="regLogin" required></div><div class="form-group"><label for="regPassword">Пароль:</label><input type="password" id="regPassword" required></div><div class="form-group"><label for="regPasswordConfirm">Подтвердите пароль:</label><input type="password" id="regPasswordConfirm" required></div><button type="submit" class="modal-btn">Зарегистрироваться</button><div id="registerResponse" class="response-message"></div></form></div></div>
    <div id="loginModal" class="modal"><div class="modal-content"><div class="modal-header"><h2>Вход</h2><span class="modal-close">&times;</span></div><form id="loginForm"><div class="form-group"><label for="loginEmail">Email или логин:</label><input type="text" id="loginEmail" required></div><div class="form-group"><label for="loginPassword">Пароль:</label><input type="password" id="loginPassword" required></div><button type="submit" class="modal-btn">Войти</button><div class="recovery-link"><a href="#" id="forgotPassword">Забыли пароль?</a></div><div id="loginResponse" class="response-message"></div></form></div></div>
    <div id="recoveryModal" class="modal"><div class="modal-content"><div class="modal-header"><h2>Восстановление пароля</h2><span class="recovery-close">&times;</span></div><form id="recoveryForm"><div class="form-group"><label for="recoveryEmail">Email:</label><input type="email" id="recoveryEmail" required></div><button type="submit" class="modal-btn">Восстановить пароль</button><div id="recoveryResponse" class="response-message"></div></form></div></div>

    <!-- Подключаем скрипты по частям -->
    <script src="app.js"></script>
    <script src="ui.js"></script>
    <script src="media.js"></script>
</body>
</html>
